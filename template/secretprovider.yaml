apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: myrepoexplorer_secretprovider
  namespace: repo-explorer
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "{{ .Values.CACHE_TTL }}"
        objectType: "ssmparameter"
        data:
          - key: "{{ .Values.CACHE_TTL }}"
            objectName: "CACHE_TTL"
      - objectName: "{{ .Values.GITHUB_API }}"
        objectType: "ssmparameter"
        data:
          - key: "{{ .Values.GITHUB_API }}"
            objectName: "GITHUB_API"
      - objectName: "{{ .Values.GITHUB_TOKEN }}"
        objectType: "ssmparameter"
        data:
          - key: "{{ .Values.GITHUB_TOKEN }}"
            objectName: "GITHUB_TOKEN"
      - objectName: "{{ .Values.MAX_REQUESTS }}"
        objectType: "ssmparameter"
        data:
          - key: "{{ .Values.MAX_REQUESTS }}"
            objectName: "MAX_REQUESTS"
      - objectName: "{{ .Values.REDIS_HOST }}"
        objectType: "ssmparameter"
        data:
          - key: "{{ .Values.REDIS_HOST }}"
            objectName: "REDIS_HOST"
      - objectName: "{{ .Values.WINDOW_SECONDS }}"
        objectType: "ssmparameter"
        data:
          - key: "{{ .Values.WINDOW_SECONDS }}"
            objectName: "WINDOW_SECONDS"